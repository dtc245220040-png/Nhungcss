
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng CSS vào HTML</title>

    <!-- Cách 2: Internal CSS -->
    <style>
        h2 {
            color: blue;
        }

        .internal-text {
            color: green;
        }
    </style>

    <!-- Cách 3: External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành nhúng CSS vào HTML</h1>

    <!-- Cách 1: Inline CSS -->
    <h2 style="color: red;">Phần 1: Inline CSS</h2>
    <p style="color: red;">
        Đây là đoạn văn sử dụng Inline CSS để đổi màu chữ thành màu đỏ.
    </p>

    <!-- Cách 2: Internal CSS -->
    <h2>Phần 2: Internal CSS</h2>
    <p class="internal-text">
        Đây là đoạn văn sử dụng Internal CSS để đổi màu chữ thành màu xanh lá.
    </p>

    <!-- Cách 3: External CSS -->
    <h2>Phần 3: External CSS</h2>
    <p class="external-text">
        Đây là đoạn văn sử dụng External CSS để đổi màu chữ thành màu tím.
    </p>
</body>
</html>
